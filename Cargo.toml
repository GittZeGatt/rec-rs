[package]
name = "rec"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A simple, fast, reliable screen and camera recorder for macOS"

[dependencies]
anyhow = "1.0.104"
block2 = "0.6"
clap = { version = "4.6.7", features = ["derive"] }
dispatch2 = "0.3"
libc = "0.2.190"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-quartz-core", "objc2-core-foundation"] }
objc2-av-foundation = { version = "0.3", features = ["block2", "dispatch2", "objc2-core-media", "objc2-core-video", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-image = { version = "0.3", features = ["objc2-core-video", "objc2-core-graphics", "objc2-core-foundation", "objc2-metal"] }
objc2-core-media = { version = "0.3", features = ["objc2-core-video", "dispatch2", "block2", "objc2-core-audio-types"] }
objc2-core-video = { version = "0.3", features = ["objc2-core-graphics", "objc2-io-surface"] }
objc2-foundation = "0.3"
objc2-io-surface = "0.3"
objc2-quartz-core = "0.3"
objc2-screen-capture-kit = { version = "0.3", features = ["block2", "dispatch2", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "objc2-av-foundation"] }

[profile.release]
debug = 1
